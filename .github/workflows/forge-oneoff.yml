name: Forge 1.20.1 One-off Build

on:
  push:
    branches:
      - forge-1.20.1-oneoff

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build Forge 1.20.1 JAR
        run: gradle build
      - name: Upload Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: ducky-s-utilities-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
